<!-- src/app/pages/header/header.html -->
<div class="app-layout d-flex">
  <!-- Sidebar -->
  <nav class="app-sidebar d-flex flex-column" [class.collapsed]="collapsed()" [class.show-mobile]="mobileVisible">
    <div class="sidebar-top d-flex align-items-center justify-content-between px-3 py-2">
      <div class="brand d-flex align-items-center gap-2">
        <i class="fa-solid fa-rocket brand-icon"></i>
        <span class="brand-text" *ngIf="!collapsed()">Admin</span>
      </div>

      <div class="d-flex gap-2 align-items-center">
        <button class="btn btn-sm btn-outline-secondary toggle-btn" (click)="toggle()" aria-label="Toggle sidebar">
          <i [class.fa-chevron-left]="!collapsed()" [class.fa-chevron-right]="collapsed()" class="fa-solid"></i>
        </button>
        <button class="btn btn-sm btn-outline-secondary d-md-none" (click)="hideMobile()" aria-label="Close sidebar">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>

    <ul class="nav flex-column px-1">
      <li *ngFor="let item of navItems" class="nav-item">
        <a class="nav-link d-flex align-items-center gap-2"
           [routerLink]="item.path"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }"
           (click)="onNavClickMobile()">
          <i [class]="item.icon"></i>
          <span class="link-text" *ngIf="!collapsed()">{{ item.label }}</span>
          <span class="ms-auto badge bg-primary" *ngIf="item.badge && !collapsed()">{{ item.badge }}</span>
        </a>
      </li>
    </ul>

    <div class="sidebar-footer mt-auto px-3 py-2" *ngIf="!collapsed()">
      <small class="text-muted">Logged in as</small>
      <div class="user-name">Admin User</div>
    </div>
  </nav>

  <!-- Main column -->
  <div class="main-column d-flex flex-column flex-grow-1">
    <header class="topbar d-flex align-items-center justify-content-between px-3">
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-outline-secondary d-md-none" (click)="showMobile()" aria-label="Open sidebar">
          <i class="fa-solid fa-bars"></i>
        </button>

        <div class="brand d-flex align-items-center gap-2">
          <i class="fa-solid fa-rocket brand-icon"></i>
          <h5 class="mb-0 brand-title">Admin Panel</h5>
        </div>
      </div>

      <div class="top-actions d-flex align-items-center gap-2">
        <button class="btn btn-sm btn-outline-primary">Profile</button>
        <button class="btn btn-sm btn-outline-danger">Logout</button>
      </div>
    </header>

    <main class="content p-3">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
