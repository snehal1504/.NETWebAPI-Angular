<div class="designation-page">
  <h2>Designation Management</h2>

  <!-- Add Designation -->
  <form (ngSubmit)="addDesignation()" #designationForm="ngForm" class="mb-3">
    <div class="row g-2">
      <div class="col-md-5">
        <input type="text" class="form-control" placeholder="Designation Name"
               [(ngModel)]="newDesignation.designationName" name="designationName" required />
      </div>
      <div class="col-md-5">
        <input type="number" class="form-control" placeholder="Department Id"
               [(ngModel)]="newDesignation.departmentId" name="departmentId" required />
      </div>
      <div class="col-md-2">
        <button class="btn btn-success w-100" [disabled]="!designationForm.valid">Add</button>
      </div>
    </div>
  </form>

  <!-- Designation Table -->
  <div class="table-responsive">
    <table class="table table-bordered table-striped">
      <thead class="table-primary">
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Department Id</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let des of designations; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ des.designationName }}</td>
          <td>{{ des.departmentId }}</td>
          <td>
            <button class="btn btn-sm btn-info me-2" (click)="editDesignation(des)">Edit</button>
            <button class="btn btn-sm btn-danger" (click)="deleteDesignation(des.designationId)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Edit Designation -->
  <div *ngIf="editingDesignation" class="edit-form mt-3">
    <h5>Edit Designation</h5>
    <form (ngSubmit)="updateDesignation()">
      <div class="row g-2">
        <div class="col-md-5">
          <input type="text" class="form-control" [(ngModel)]="editingDesignation.designationName" name="editName" required />
        </div>
        <div class="col-md-5">
          <input type="number" class="form-control" [(ngModel)]="editingDesignation.departmentId" name="editDeptId" required />
        </div>
        <div class="col-md-2">
          <button class="btn btn-primary w-100">Update</button>
        </div>
      </div>
    </form>
  </div>
</div>
