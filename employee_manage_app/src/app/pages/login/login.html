<div class="login-page">
  <section class="login-card">
    <div class="login-card__hero mb-4">
      <div class="login-card__icon">EM</div>
      <div>
        <h1 class="login-card__title mb-1">Welcome Back</h1>
        <p class="text-muted mb-0">Sign in to manage employees and departments.</p>
      </div>
    </div>

    <form class="login-form" autocomplete="off">
      <div class="mb-3">
        <label for="loginEmail" class="form-label">Email address</label>
        <input type="email" [(ngModel)]="loginObj.email" name="loginEmail" class="form-control form-control-lg" id="loginEmail" placeholder="name@example.com" />
      </div>
      <div class="mb-3">
        <label for="loginPassword" class="form-label">Password</label>
        <input type="password" [(ngModel)]="loginObj.password" name="loginPassword" class="form-control form-control-lg" id="loginPassword" placeholder="Enter your password" />
      </div>
      <div class="d-flex justify-content-between align-items-center mb-4">
        <!-- <div class="form-check">
          <input class="form-check-input" type="checkbox" id="rememberMe" />
          <label class="form-check-label" for="rememberMe">Remember me</label>
        </div> -->
        <a href="#" class="text-decoration-none">Forgot password?</a>
      </div>
      <button type="button" (click)="onLogin()" class="btn btn-primary btn-lg w-100 mb-3">Sign in</button>
    </form>

    <div class="login-divider my-4">
      <span></span>
      <small>or continue with</small>
      <span></span>
    </div>

    <div class="d-flex gap-2 login-social-buttons">
      <button type="button" class="btn btn-outline-secondary flex-fill">Google</button>
      <button type="button" class="btn btn-outline-secondary flex-fill">Microsoft</button>
    </div>

    <p class="login-card__footer text-center mt-4">
      New here? <a href="#" class="text-decoration-none">Create an account</a>
    </p>
  </section>
</div>
