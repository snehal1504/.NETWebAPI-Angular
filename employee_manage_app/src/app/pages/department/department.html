<div class="department-page">
  <h2>Department Management</h2>

  <!-- Add Department -->
  <form (ngSubmit)="addDepartment()" #deptForm="ngForm" class="mb-3">
    <div class="row g-2">
      <div class="col-md-6">
        <input type="text" class="form-control" placeholder="Department Name"
               [(ngModel)]="newDept.departmentName" name="departmentName" required />
      </div>
      <div class="col-md-3">
        <select class="form-select" [(ngModel)]="newDept.isActive" name="isActive">
          <option [ngValue]="true">Active</option>
          <option [ngValue]="false">Inactive</option>
        </select>
      </div>
      <div class="col-md-3">
        <button class="btn btn-success w-100" [disabled]="!deptForm.valid">Add</button>
      </div>
    </div>
  </form>

  <!-- Department Table -->
  <div class="table-responsive">
    <table class="table table-bordered table-striped">
      <thead class="table-primary">
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let dept of departments; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ dept.departmentName }}</td>
          <td>{{ dept.isActive ? 'Active' : 'Inactive' }}</td>
          <td>
            <button class="btn btn-sm btn-info me-2" (click)="editDepartment(dept)">Edit</button>
            <button class="btn btn-sm btn-danger" (click)="deleteDepartment(dept.departmentId)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Edit Department Modal -->
  <div *ngIf="editingDept" class="edit-form mt-3">
    <h5>Edit Department</h5>
    <form (ngSubmit)="updateDepartment()">
      <div class="row g-2">
        <div class="col-md-6">
          <input type="text" class="form-control" [(ngModel)]="editingDept.departmentName" name="editName" required />
        </div>
        <div class="col-md-3">
          <select class="form-select" [(ngModel)]="editingDept.isActive" name="editActive">
            <option [ngValue]="true">Active</option>
            <option [ngValue]="false">Inactive</option>
          </select>
        </div>
        <div class="col-md-3">
          <button class="btn btn-primary w-100">Update</button>
        </div>
      </div>
    </form>
  </div>
</div>
