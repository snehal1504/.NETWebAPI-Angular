<div class="settings-page">
  <h2>Settings</h2>

  <form (ngSubmit)="saveSettings()">
    <!-- Theme -->
    <div class="mb-3">
      <label class="form-label">Theme</label>
      <select [(ngModel)]="userSettings.theme" name="theme" class="form-select">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </div>

    <!-- Notifications -->
    <div class="mb-3 form-check">
      <input type="checkbox" [(ngModel)]="userSettings.notifications" name="notifications" class="form-check-input" />
      <label class="form-check-label">Enable Notifications</label>
    </div>

    <!-- Language -->
    <div class="mb-3">
      <label class="form-label">Language</label>
      <select [(ngModel)]="userSettings.language" name="language" class="form-select">
        <option value="en">English</option>
        <option value="hi">Hindi</option>
      </select>
    </div>

    <button class="btn btn-primary">Save Settings</button>
  </form>
</div>
